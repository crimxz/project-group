<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimoz - Авторизация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
            color: #58a6ff;
        }
        
        .auth-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        
        .tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid #30363d;
        }
        
        .tab {
            padding: 8px 16px;
            cursor: pointer;
            color: #8b949e;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .tab.active {
            color: #58a6ff;
            border-bottom: 2px solid #58a6ff;
        }
        
        .tab:hover:not(.active) {
            color: #c9d1d9;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 10px 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            transition: border 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15);
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        
        .btn-primary {
            background-color: #238636;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2ea043;
        }
        
        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-secondary:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
        
        .btn-icon {
            width: 18px;
            height: 18px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
            color: #8b949e;
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #30363d;
        }
        
        .divider span {
            padding: 0 16px;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #8b949e;
        }
        
        .footer a {
            color: #58a6ff;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #f85149;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        
        .success-message {
            background-color: #238636;
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">crimoz</div>
        
        <div id="successMessage" class="success-message">
            Авторизация успешна! Перенаправление...
        </div>
        
        <div class="auth-card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Вход</div>
                <div class="tab" onclick="switchTab('register')">Регистрация</div>
            </div>
            
            <div id="loginTab" class="tab-content active">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                        <div class="error-message" id="loginEmailError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" placeholder="Введите пароль" required>
                        <div class="error-message" id="loginPasswordError"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>
                
                <div class="divider"><span>Или войдите через</span></div>
                
                <button class="btn btn-secondary" onclick="authWithGitHub()">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    GitHub
                </button>
                
                <button class="btn btn-secondary" onclick="authWithYandex()">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.5 16.5h-3.5v-9h-2v9h-3.5l5-5 5 5z"/>
                    </svg>
                    Яндекс
                </button>
            </div>
            
            <div id="registerTab" class="tab-content">
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" placeholder="you@example.com" required>
                        <div class="error-message" id="registerEmailError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="registerPassword">Пароль</label>
                        <input type="password" id="registerPassword" placeholder="Придумайте пароль" required>
                        <div class="error-message" id="registerPasswordError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">Подтвердите пароль</label>
                        <input type="password" id="confirmPassword" placeholder="Повторите пароль" required>
                        <div class="error-message" id="confirmPasswordError"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                </form>
                
                <div class="divider"><span>Или зарегистрируйтесь через</span></div>
                
                <button class="btn btn-secondary" onclick="authWithGitHub()">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    GitHub
                </button>
                
                <button class="btn btn-secondary" onclick="authWithYandex()">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.5 16.5h-3.5v-9h-2v9h-3.5l5-5 5 5z"/>
                    </svg>
                    Яндекс
                </button>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 crimoz. Все права защищены.</p>
            <p><a href="#">Политика конфиденциальности</a> · <a href="#">Условия использования</a></p>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Убираем активный класс у всех вкладок
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Добавляем активный класс выбранной вкладке
            if (tabName === 'login') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('registerTab').classList.add('active');
            }
        }
        
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }
        
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(error => {
                error.style.display = 'none';
            });
        }
        
        function showSuccess() {
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }
        
        function handleLogin(event) {
            event.preventDefault();
            clearErrors();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            // Простая валидация
            if (!email.includes('@')) {
                showError('loginEmailError', 'Введите корректный email');
                return;
            }
            
            if (password.length < 6) {
                showError('loginPasswordError', 'Пароль должен содержать минимум 6 символов');
                return;
            }
            
            // Имитация успешного входа
            console.log('Вход с:', { email, password });
            showSuccess();
        }
        
        function handleRegister(event) {
            event.preventDefault();
            clearErrors();
            
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Валидация
            if (!email.includes('@')) {
                showError('registerEmailError', 'Введите корректный email');
                return;
            }
            
            if (password.length < 6) {
                showError('registerPasswordError', 'Пароль должен содержать минимум 6 символов');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('confirmPasswordError', 'Пароли не совпадают');
                return;
            }
            
            // Имитация успешной регистрации
            console.log('Регистрация с:', { email, password });
            showSuccess();
            
            // Переключаем на вкладку входа после регистрации
            setTimeout(() => switchTab('login'), 1500);
        }
        
        function authWithGitHub() {
            // Имитация OAuth авторизации через GitHub
            console.log('Авторизация через GitHub...');
            showSuccess();
            
            // В реальном приложении здесь был бы redirect на GitHub OAuth
            // window.location.href = 'https://github.com/login/oauth/authorize?client_id=...';
        }
        
        function authWithYandex() {
            // Имитация OAuth авторизации через Яндекс
            console.log('Авторизация через Яндекс...');
            showSuccess();
            
            // В реальном приложении здесь был бы redirect на Яндекс OAuth
            // window.location.href = 'https://oauth.yandex.ru/authorize?client_id=...';
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            // Проверяем, есть ли сохраненный email в localStorage
            const savedEmail = localStorage.getItem('crimoz_email');
            if (savedEmail) {
                document.getElementById('loginEmail').value = savedEmail;
            }
            
            // Сохраняем email при вводе
            document.getElementById('loginEmail').addEventListener('input', function() {
                localStorage.setItem('crimoz_email', this.value);
            });
        });
    </script>
</body>
</html>
